syntax = "proto3";

package agentshield.v1;

option go_package = "github.com/agentshield/gateway-grpc/gen/go/agentshield/v1;agentshieldv1";

import "google/protobuf/struct.proto";

service AgentShield {
  rpc Guard(GuardRequest) returns (GuardResponse);
  rpc GuardBatch(BatchGuardRequest) returns (BatchGuardResponse);
  rpc StorePolicy(StorePolicyRequest) returns (StorePolicyResponse);
  rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message GuardRequest {
  string tool_name = 1;
  google.protobuf.Struct params = 2;
  string agent_id = 3;
  string session_id = 4;
  Policy policy = 5;
  double estimated_cost = 6;
}

message GuardResponse {
  bool allowed = 1;
  string reason = 2;
  ActionTaken action_taken = 3;
  string timestamp = 4;
  Remediation remediation = 5;
}

enum ActionTaken {
  ACTION_TAKEN_UNSPECIFIED = 0;
  ALLOW = 1;
  BLOCK = 2;
  REQUIRE_APPROVAL = 3;
  CIRCUIT_TRIPPED = 4;
}

message Remediation {
  string status = 1;
  string suggested_fix = 2;
  double max_allowed_value = 3;
}

message BatchGuardRequest {
  repeated GuardRequest requests = 1;
}

message BatchGuardResponse {
  repeated GuardResponse results = 1;
}

message Policy {
  repeated string allowed_tools = 1;
  repeated string forbidden_tools = 2;
  map<string, double> max_param_values = 3;
  repeated string forbidden_patterns = 4;
  repeated string required_fields = 5;
  RateLimit rate_limit = 6;
  double max_cost_per_session = 7;
  CircuitBreaker circuit_breaker = 8;
  bool enable_injection_sanitizer = 9;
  int32 timeout_ms = 10;
  bool require_approval = 11;
  string webhook_url = 12;
}

message RateLimit {
  int32 max_calls_per_minute = 1;
}

message CircuitBreaker {
  int32 max_repeated_calls = 1;
  int32 time_window_ms = 2;
}

message StorePolicyRequest {
  string id = 1;
  Policy policy = 2;
}

message StorePolicyResponse {
  string id = 1;
  bool stored = 2;
}

message GetPolicyRequest {
  string id = 1;
}

message GetPolicyResponse {
  Policy policy = 1;
}

message ListPoliciesRequest {}

message ListPoliciesResponse {
  repeated string policy_ids = 1;
}

message DeletePolicyRequest {
  string id = 1;
}

message DeletePolicyResponse {
  bool deleted = 1;
}

message GetSchemaRequest {}

message GetSchemaResponse {
  string schema_json = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  string status = 1;
  string version = 2;
}