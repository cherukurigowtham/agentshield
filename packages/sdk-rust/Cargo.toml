[package]
name = "agentshield"
version = "0.1.0"
edition = "2021"
description = "Deterministic security, guardrails, and governance for autonomous AI agents"
license = "MIT"
repository = "https://github.com/agentshield/agentshield"
keywords = ["ai", "agents", "guardrails", "security", "governance"]
categories = ["api-bindings", "security"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.21"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
async-trait = "0.1"
dashmap = "5.0"
hex = "0.4"

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
rand = "0.8"