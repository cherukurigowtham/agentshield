[package]
name = "agentshield-core"
version = "0.1.0"
edition = "2021"
authors = ["AgentShield Core Engineering"]
description = "Zero-copy, sub-microsecond security guardrail and AST injection scanner engine written in Rust."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
unicode-normalization = "0.1"

[dev-dependencies]
