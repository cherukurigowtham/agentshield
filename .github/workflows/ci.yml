name: AgentShield Enterprise CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================================================
  # STAGE 1: MONOREPO BUILD & COMPILATION
  # ==========================================================================
  build-core:
    name: 🏗️ Build Core SDK & Monorepo Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build TypeScript Core SDK
        run: |
          cd packages/sdk-ts
          npm install
          npm run build

      - name: Upload Built SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ts-dist
          path: packages/sdk-ts/dist/
          retention-days: 1

  # ==========================================================================
  # STAGE 2: PARALLEL VERIFICATION & TESTING (5 JOBS)
  # ==========================================================================
  sdk-security-tests:
    name: 🛡️ SDK Core, OWASP & MITRE Red-Teaming Tests
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Built SDK Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: packages/sdk-ts/dist/

      - name: Install SDK dependencies
        run: |
          cd packages/sdk-ts
          npm install

      - name: Execute Full Automated Security & Red-Teaming Suite
        run: |
          node --test packages/sdk-ts/dist/evaluator.test.js packages/sdk-ts/dist/stress.test.js packages/sdk-ts/dist/owasp.test.js packages/sdk-ts/dist/mitre.test.js packages/sdk-ts/dist/adapters.test.js packages/sdk-ts/dist/redteam.test.js

  policy-packs:
    name: 📦 Industry Policy Packs Validation
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Built SDK Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: packages/sdk-ts/dist/

      - name: Build and Test Policy Packs
        run: |
          cd packages/policy-packs
          npm install
          npm run build
          node --test dist/policy.test.js

  cli-utility:
    name: 💻 Developer CLI Utility Tests
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Built SDK Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: packages/sdk-ts/dist/

      - name: Build and Test CLI Package
        run: |
          cd packages/cli
          npm install
          npm run build
          node --test dist/cli.test.js

  python-sdk:
    name: 🐍 Python SDK (`agentshield-os`) Parity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Execute Python SDK Unit & Fuzzing Suite
        run: python packages/sdk-py/test_agentshield.py

  nextjs-dashboard:
    name: 📊 Next.js Control Plane App Build
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Built SDK Artifact
        uses: actions/download-artifact@v4
        with:
          name: sdk-ts-dist
          path: packages/sdk-ts/dist/

      - name: Compile Next.js Control Plane Dashboard
        run: |
          cd apps/dashboard
          npm install
          npm run build

  # ==========================================================================
  # STAGE 3: MASTER RELEASE GATEWAY (CD TELEMETRY)
  # ==========================================================================
  release-gate:
    name: 🚀 Master CI/CD Release Readiness Gate
    needs: [sdk-security-tests, policy-packs, cli-utility, python-sdk, nextjs-dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Release Gate Criteria
        run: |
          if echo "${{ needs.sdk-security-tests.result }},${{ needs.policy-packs.result }},${{ needs.cli-utility.result }},${{ needs.python-sdk.result }},${{ needs.nextjs-dashboard.result }}" | grep -q "failure\|cancelled"; then
            echo "❌ CI/CD Release Gate Failed"
            exit 1
          else
            echo "==============================================================="
            echo "✅ ALL ENTERPRISE AGENTSHIELD CI/CD CHECKS PASSED (31/31)"
            echo "🚀 RELEASE STATUS: PRODUCTION READY"
            echo "==============================================================="
          fi