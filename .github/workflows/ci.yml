name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  typescript-sdk:
    name: TypeScript SDK & Framework Adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install
      - run: npm --prefix packages/sdk-ts run build
      - name: Run SDK & Red-Teaming Automated Tests
        run: node --test packages/sdk-ts/dist/evaluator.test.js packages/sdk-ts/dist/stress.test.js packages/sdk-ts/dist/owasp.test.js packages/sdk-ts/dist/mitre.test.js packages/sdk-ts/dist/adapters.test.js packages/sdk-ts/dist/redteam.test.js

  policy-packs:
    name: Industry Policy Packs Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install
      - run: npm --prefix packages/sdk-ts run build
      - run: npm --prefix packages/policy-packs run build
      - name: Run Policy Packs Tests
        run: node --test packages/policy-packs/dist/policy.test.js

  cli-utility:
    name: Developer CLI Utility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install
      - run: npm --prefix packages/sdk-ts run build
      - run: npm --prefix packages/cli run build
      - name: Run CLI Tests
        run: node --test packages/cli/dist/cli.test.js

  python-sdk:
    name: Python SDK (`agentshield-os`)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run Python SDK Unit Tests
        run: python packages/sdk-py/test_agentshield.py

  nextjs-dashboard:
    name: Next.js Control Plane Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm install
      - run: npm --prefix packages/sdk-ts run build
      - run: npm --prefix apps/dashboard run build

  summary:
    name: Master CI Status Summary
    needs: [typescript-sdk, policy-packs, cli-utility, python-sdk, nextjs-dashboard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if echo "${{ needs.typescript-sdk.result }},${{ needs.policy-packs.result }},${{ needs.cli-utility.result }},${{ needs.python-sdk.result }},${{ needs.nextjs-dashboard.result }}" | grep -q "failure\|cancelled"; then
            echo "❌ CI Build Failed"
            exit 1
          else
            echo "✅ All 31/31 AgentShield CI Security Checks Passed"
          fi